<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">
                <header class="mb-4">
                    <p class="text-primary fw-semibold text-uppercase small mb-2">Student services</p>
                    <h1 class="display-6 fw-bold">Student registration</h1>
                    <p class="text-secondary mb-0">Enter your details to register for a course.</p>
                </header>

                <div id="formMessage" class="alert d-none" role="status" aria-live="polite"></div>

                <form id="registrationForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
                            <div class="invalid-feedback">Please enter your first name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
                            <div class="invalid-feedback">Please enter your last name.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="dateOfBirth" class="form-label">Date of birth</label>
                            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required>
                            <div class="invalid-feedback">Please select your date of birth.</div>
                        </div>
                        <div class="col-12">
                            <label for="course" class="form-label">Course</label>
                            <select class="form-select" id="course" name="course" required>
                                <option value="" selected disabled>Select a course</option>
                                <option value="computer-science">Computer Science</option>
                                <option value="business-administration">Business Administration</option>
                                <option value="graphic-design">Graphic Design</option>
                                <option value="biology">Biology</option>
                            </select>
                            <div class="invalid-feedback">Please choose a course.</div>
                        </div>
                        <div class="col-12 pt-2">
                            <button class="btn btn-primary px-4" type="submit">Register</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
